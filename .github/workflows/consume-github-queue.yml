name: consume-github-queue

on:
  workflow_run:
    workflows: [route-github-event]
    types: [completed]

permissions:
  issues: write
  pull-requests: write
  contents: read
  actions: read

jobs:
  triage-agent:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install router + optional Cursor SDK
        run: |
          pip install -e .
          pip install "cursor-sdk>=0.1.0"
      - uses: actions/download-artifact@v4
        with:
          name: github-route-${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Run triage agent (Cursor or template fallback)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/run_agent_from_route.py route-result.json --backend auto | tee agent-summary.json
