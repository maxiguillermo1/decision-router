name: practice-lab-drill

on:
  schedule:
    # Weekly unattended health check (Mondays 14:00 UTC)
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      scenario:
        description: Which routing path to exercise
        required: true
        default: random
        type: choice
        options:
          - random
          - security
          - bug
          - spam
          - triage
  push:
    branches: [main]
    paths:
      - lab/drills/**

permissions:
  issues: write
  contents: read

jobs:
  open-drill-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install router + optional Cursor SDK
        run: |
          pip install -e .
          pip install "cursor-sdk>=0.1.0"
      - name: Create practice issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          SCENARIO="${{ github.event_name == 'workflow_dispatch' && inputs.scenario || 'random' }}"
          python scripts/run_practice_drill.py --scenario "$SCENARIO" | tee drill-result.json
      - name: Route + triage agent (same job — bot-opened issues skip workflow triggers)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          NUMBER=$(python -c "import json; print(json.load(open('drill-result.json'))['number'])")
          python scripts/synthesize_github_event.py \
            --number "$NUMBER" \
            --output "$RUNNER_TEMP/github-event.json"
          python github_route.py \
            --event "$RUNNER_TEMP/github-event.json" \
            --backend auto \
            --output route-result.json \
            --apply-labels \
            --post-comment
          python scripts/run_agent_from_route.py route-result.json --backend auto
      - name: Assert drill routed as expected
        run: |
          python scripts/verify_drill_route.py drill-result.json route-result.json \
            --output drill-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: practice-drill-${{ github.run_id }}
          path: |
            drill-result.json
            route-result.json
            drill-report.json
      - name: Drill metadata
        run: cat drill-report.json
