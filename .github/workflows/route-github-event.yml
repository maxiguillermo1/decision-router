name: route-github-event

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue or PR number to re-run the router on
        required: true

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install router
        run: pip install -e .
      - name: Synthesize webhook event (manual rerun)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/synthesize_github_event.py \
            --number "${{ inputs.issue_number }}" \
            --output "$RUNNER_TEMP/github-event.json"
          echo "GITHUB_EVENT_PATH=$RUNNER_TEMP/github-event.json" >> "$GITHUB_ENV"
      - name: Decide route (rules or Jev if secret set)
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          EVENT_ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EVENT_ARGS=(--event "$RUNNER_TEMP/github-event.json")
          fi
          python github_route.py "${EVENT_ARGS[@]}" --backend auto --output route-result.json
          cat route-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: github-route-${{ github.run_id }}
          path: |
            route-result.json
            queue/github/**/*
          if-no-files-found: ignore
      - name: Apply routing label + triage comment
        env:
          GH_TOKEN: ${{ github.token }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          EVENT_ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EVENT_ARGS=(--event "$RUNNER_TEMP/github-event.json")
          fi
          python github_route.py "${EVENT_ARGS[@]}" --backend auto --apply-labels --post-comment --no-queue
